name: UniDash
options:
  bundleIdPrefix: com.personal.unidash
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "LR8339HK5J"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    ENABLE_TESTABILITY: YES

targets:
  UniDash_iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Views
      - path: Resources/Assets.xcassets
      - path: Resources/LMU_Stundenplan_WS24.pdf
    settings:
      base:
        PRODUCT_NAME: UniDash
        PRODUCT_MODULE_NAME: UniDash
        PRODUCT_BUNDLE_IDENTIFIER: de.yuntong.unidash
        DEVELOPMENT_TEAM: "LR8339HK5J"
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  UniDash_macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Views
      - path: Resources/Assets.xcassets
      - path: Resources/LMU_Stundenplan_WS24.pdf
    settings:
      base:
        PRODUCT_NAME: UniDash
        PRODUCT_MODULE_NAME: UniDash
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.unidash.macos
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/UniDash_macOS.entitlements
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
    scheme:
      testTargets:
        - UniDashTests_macOS

  UniDashTests_macOS:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/UniDashTests
      - path: Models
      - path: Services
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual


